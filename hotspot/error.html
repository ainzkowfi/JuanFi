<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e74c3c">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <link rel="icon" type="image/x-icon" sizes="32x32" href="favicon.ico?v=1">
		<title>Internet hotspot - Error</title>
    <link rel="stylesheet" href="assets/css/base.css?v=174">
    <link rel="stylesheet" href="assets/css/core.css?v=205">
    <link rel="stylesheet" href="assets/css/portal.css?v=183">
    <!-- ponytail: this page's .ie-fixMinHeight / .main / .wrap / .info were
         defined in no stylesheet in the repo, so the error page rendered
         unstyled. These four rules are what it actually needs. -->
    <style>
        body { color: #fff; background-color: #3d4044; }
        .ie-fixMinHeight { min-height: 100dvh; }
        .main { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
        .wrap { max-width: 34rem; }
        .wrap h1 { color: #fff; }
        .wrap #errMsg { color: #ff8a80; }
        .info { color: #c9cfd7; opacity: 1; }
        .error-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            margin-top: 18px;
            padding: 0 22px;
            border-radius: 8px;
            font-weight: 800;
            color: #fff !important;
            background-color: #17a2b8;
            border: 1px solid #17a2b8;
            text-decoration: none;
        }
        .error-back:active { transform: translateY(1px); }
    </style>
</head>

<body>
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap">
                <h1>Hotspot error: <span id="errMsg" role="alert" aria-live="polite"></span></h1>
                <!-- RouterOS escapes nothing in $(error), and errors.txt can
                     embed $(error-orig) from a RADIUS reply, so -esc
                     percent-encodes < > " & and the script fills the visible
                     span with the decoded text. -->
                <span id="errRaw" style="display:none">$(error-esc)</span>
                <a id="loginLink" class="btn btn-info error-back" href="login">BACK TO LOGIN</a>
                <span id="loginDst" style="display:none">$(link-login)</span>
            </div>
        </div>
    </div>
    <script>
        // $(error) is percent-encoded by $(error-esc); decode it into the
        // visible span. The login URL is set from span text after a scheme
        // check.
        try {
            var raw = document.getElementById("errRaw").textContent || "";
            try { raw = decodeURIComponent(raw); } catch (x) { }
            document.getElementById("errMsg").textContent = raw;
        } catch (x) { }
        try {
            var u = document.getElementById("loginDst").textContent || "login";
            document.getElementById("loginLink").href = /^(https?:\/\/|\/)/.test(u) ? u : "login";
        } catch (e) {}
    </script>
</body>

</html>
