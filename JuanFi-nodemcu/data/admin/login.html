<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111417">
<title>JuanFi Admin Sign In</title>
<style>
  :root {
    --bg: #111417;
    --surface: #181d22;
    --surface-2: #1f262d;
    --border: #2c353f;
    --text: #e8edf2;
    --muted: #9aa7b4;
    --accent: #d4a843;
    --accent-ink: #14110a;
    --danger: #e35d5b;
    --focus: #f0c96a;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 10% -10%, #1d232a 0%, transparent 60%),
      radial-gradient(800px 400px at 110% 110%, #1a2026 0%, transparent 55%),
      var(--bg);
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }
  .mark {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: conic-gradient(from 210deg, #f2d27a, #b8831e, #f0c96a, #8f6414, #f2d27a);
    box-shadow: inset 0 0 0 3px rgba(17,20,23,.55), 0 8px 24px rgba(0,0,0,.35);
    flex: none;
  }
  .brand h1 {
    font-size: 1.35rem;
    line-height: 1.2;
    margin: 0;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 0.95rem; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 20px 20px;
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  form { display: grid; gap: 14px; }
  .field { display: grid; gap: 6px; }
  label { font-size: 0.95rem; font-weight: 600; color: var(--text); }
  input[type="text"], input[type="password"] {
    width: 100%;
    min-height: 48px;
    padding: 12px 14px;
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
  }
  input::placeholder { color: #6f7c89; }
  input:focus-visible {
    border-color: var(--focus);
    box-shadow: 0 0 0 3px rgba(240, 201, 106, 0.25);
  }
  .actions { margin-top: 4px; display: grid; gap: 10px; }
  button {
    min-height: 48px;
    padding: 12px 16px;
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    color: var(--accent-ink);
    background: linear-gradient(180deg, #e7c464, #c9982e);
    touch-action: manipulation;
  }
  button:hover { filter: brightness(1.05); }
  button:active { filter: brightness(0.98); }
  button:focus-visible {
    outline: 3px solid rgba(240, 201, 106, 0.45);
    outline-offset: 2px;
  }
  button[disabled] { opacity: 0.7; cursor: progress; }
  .status {
    min-height: 1.5em;
    font-size: 0.95rem;
    color: var(--danger);
  }
  .status[aria-live] { margin: 0; }
  .hint { margin: 14px 2px 0; color: var(--muted); font-size: 0.9rem; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1><span translate="no">JuanFi</span> Admin</h1>
        <p>Sign in to manage this vendo</p>
      </div>
    </div>
    <section class="card" aria-label="Sign in">
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" spellcheck="false" autocapitalize="none" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="actions">
          <button id="submitBtn" type="submit">Sign in</button>
          <p id="status" class="status" aria-live="polite"></p>
        </div>
      </form>
      <p class="hint">Default sign-in is <strong>admin</strong> / <strong>admin</strong> until you change it.</p>
    </section>
  </main>
<script>
(function () {
  var form = document.getElementById('loginForm');
  var status = document.getElementById('status');
  var btn = document.getElementById('submitBtn');
  function show(msg) { status.textContent = msg || ''; }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var u = document.getElementById('username').value;
    var p = document.getElementById('password').value;
    if (!u || !p) { show('Enter your username and password.'); return; }
    btn.disabled = true;
    var label = btn.textContent;
    btn.textContent = 'Signing in…';
    show('');
    var body = 'username=' + encodeURIComponent(u) + '&password=' + encodeURIComponent(p);
    fetch('/admin/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body,
      credentials: 'same-origin'
    }).then(function (res) {
      if (res.ok) {
        window.location.href = '/admin';
        return null;
      }
      return res.text().then(function (t) {
        show(t || 'Sign-in failed. Check your username and password.');
      });
    }).catch(function () {
      show('Could not reach the device. Check your Wi-Fi connection and try again.');
    }).then(function () {
      if (btn.disabled && btn.textContent !== label) {
        btn.disabled = false;
        btn.textContent = label;
      }
    });
  });
})();
</script>
</body>
</html>
