<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Generated Vouchers · JuanFi</title>
<style>
  :root{--bg:#0f1215;--surface:#181e24;--surface-2:#1e252d;--border:#2b3440;--text:#e7edf3;--muted:#97a4b2;--accent:#d7a93d;--accent-ink:#171309;--radius:12px}
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;color:var(--text);background:var(--bg)}
  .toolbar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:rgba(15,18,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .toolbar h1{margin:0;font-size:1.05rem;font-weight:700}
  .toolbar .sub{margin:2px 0 0;color:var(--muted);font-size:.88rem}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid #394554;background:#242c36;color:var(--text);font:inherit;font-size:.95rem;font-weight:700;cursor:pointer;touch-action:manipulation}
  .btn:hover{background:#2b3541}
  .btn.primary{background:linear-gradient(180deg,#e7c464,#c9982e);color:var(--accent-ink);border-color:transparent}
  .btn:focus-visible{outline:3px solid rgba(240,201,106,.4);outline-offset:1px}
  .wrap{padding:14px}
  .empty{color:var(--muted);padding:24px 4px}
  #theBody{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
  .voucher-box{width:220px;min-height:118px;padding:12px;border:1px solid #8a949f;border-radius:10px;background:#fff;color:#111;break-inside:avoid;page-break-inside:avoid}
  .voucher-box .title{display:block;text-align:center;font-weight:700;font-size:1rem;color:#1f2933;padding-bottom:6px;margin-bottom:8px;border-bottom:1px solid #c7ced6;overflow-wrap:anywhere}
  .voucher-box .info{display:block;font-size:.9rem;line-height:1.45;overflow-wrap:anywhere}
  .voucher-box .info b{font-weight:700}
  @media print{
    body{background:#fff;color:#000}
    .toolbar{display:none!important}
    .wrap{padding:0}
    #theBody{gap:8px}
    .voucher-box{border:1px solid #444;box-shadow:none}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
<script>
function printMe(){ window.print(); }
function clearAll(){
  if(!confirm('Clear all generated vouchers from this browser?')) return;
  document.getElementById('theBody').innerHTML = '<p class="empty">No vouchers loaded. Generate vouchers from the admin panel.</p>';
  try{ localStorage.removeItem('voucherData'); }catch(e){}
}
var ticketTemplate = "<div class='voucher-box'>"
  + "<span class='title'>REPLACE_VENDO_NAME</span>"
  + "<span class='info'><b>Code:</b> REPLACE_VOUCHER_CODE</span>"
  + "<span class='info'><b>Duration:</b> REPLACE_DURATION</span>"
  + "<span class='info'><b>Amount:</b> REPLACE_AMOUNT</span>"
  + "</div>";
function onLoad(){
  var data = '';
  try{ data = localStorage.getItem('voucherData') || ''; }catch(e){ data=''; }
  if(!data){
    document.getElementById('theBody').innerHTML = '<p class="empty">No vouchers loaded. Generate vouchers from the admin panel.</p>';
    return;
  }
  var localData = data.split('~');
  var html = '';
  for(var k=0;k<localData.length;k++){
    if(!localData[k]) continue;
    var voucherData = localData[k].split('|');
    var vendoName = voucherData[0] || 'JuanFi';
    var amount = voucherData[1] || '';
    var duration = secondsToDhms(voucherData[2] || 0);
    var codes = (voucherData[3] || '').split('#');
    for(var i=0;i<codes.length;i++){
      if(!codes[i]) continue;
      var rowScript = ticketTemplate;
      rowScript = rowScript.split('REPLACE_VENDO_NAME').join(escapeHtml(vendoName));
      rowScript = rowScript.split('REPLACE_VOUCHER_CODE').join(escapeHtml(codes[i]));
      rowScript = rowScript.split('REPLACE_DURATION').join(escapeHtml(duration));
      rowScript = rowScript.split('REPLACE_AMOUNT').join(escapeHtml(amount));
      html += rowScript;
    }
  }
  document.getElementById('theBody').innerHTML = html || '<p class="empty">No voucher codes found in the saved data.</p>';
}
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function secondsToDhms(seconds) {
  seconds = Number(seconds) || 0;
  var d = Math.floor(seconds / 86400);
  var h = Math.floor((seconds % 86400) / 3600);
  var m = Math.floor((seconds % 3600) / 60);
  var parts = [];
  if (d) parts.push(d + (d == 1 ? ' day' : ' days'));
  if (h) parts.push(h + (h == 1 ? ' hour' : ' hours'));
  if (m) parts.push(m + (m == 1 ? ' min' : ' mins'));
  return parts.length ? parts.join(' ') : '0 mins';
}
</script>
</head>
<body onload="onLoad()">
  <div class="toolbar">
    <div><h1>Generated vouchers</h1><p class="sub">Printable codes from <span translate="no">JuanFi</span></p></div>
    <div class="actions"><button type="button" class="btn primary" onclick="printMe()">Print</button><button type="button" class="btn" onclick="clearAll()">Clear</button></div>
  </div>
  <div class="wrap"><div id="theBody"></div></div>
</body>
</html>
